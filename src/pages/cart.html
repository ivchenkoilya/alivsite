<!--meta
{"title": "Корзина и оформление заказа — ALIV SPORT", "description": "Корзина и оформление заказа ALIV SPORT.", "page": "cart", "canonical": "/cart/", "data": ["products"], "scripts": ["cart"], "styles": ["cart"]}
-->
<div class="container cart-page">
  <nav class="pp-crumbs" aria-label="Хлебные крошки"><ol class="crumbs"><li><a href="index.html">Главная</a></li><li aria-current="page">Корзина</li></ol></nav>
  <h1 class="h1 slash">Корзина</h1>
  <ol class="steps" aria-label="Этапы оформления">
    <li class="is-active" data-step="1"><span>1</span>Товары</li>
    <li data-step="2"><span>2</span>Контакты</li>
    <li data-step="3"><span>3</span>Подтверждение</li>
  </ol>

  <div class="cart-layout" data-cart-layout>
    <section class="cart-lines" aria-label="Товары в корзине" data-cart-lines></section>

    <aside class="checkout" aria-labelledby="checkout-title" data-checkout>
      <div class="checkout__summary">
        <h2 class="h3" id="checkout-title">Ваш заказ</h2>
        <dl class="summary" data-summary></dl>
      </div>
      <form class="form" data-form="order" novalidate>
        <div class="field">
          <label class="field__label" for="o-name">Имя или организация <b>*</b></label>
          <div class="field__control"><svg class="i"><use href="#i-user"/></svg><input class="input" id="o-name" name="name" autocomplete="name" required placeholder="Иван Петров / ООО «Фитнес»"></div>
          <span class="field__error">Укажите имя</span>
        </div>
        <div class="field">
          <label class="field__label" for="o-phone">Телефон <b>*</b></label>
          <div class="field__control"><svg class="i"><use href="#i-phone"/></svg><input class="input" id="o-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" required placeholder="+7 (___) ___-__-__" data-phone></div>
          <span class="field__error">Проверьте номер телефона</span>
        </div>
        <div class="field">
          <label class="field__label" for="o-email">Эл. почта</label>
          <div class="field__control"><svg class="i"><use href="#i-mail"/></svg><input class="input" id="o-email" name="email" type="email" autocomplete="email" placeholder="Для счёта и КП"></div>
          <span class="field__error">Проверьте адрес почты</span>
        </div>
        <div class="field">
          <label class="field__label" for="o-city">Город доставки</label>
          <div class="field__control"><svg class="i"><use href="#i-pin"/></svg><input class="input" id="o-city" name="city" autocomplete="address-level2" placeholder="Например, Тверь"></div>
        </div>
        <div class="field">
          <label class="field__label" for="o-msg">Комментарий</label>
          <div class="field__control"><svg class="i"><use href="#i-message"/></svg><textarea class="textarea" id="o-msg" name="message" placeholder="Нужна сборка, удобное время звонка…"></textarea></div>
        </div>
        <label class="checkbox"><input type="checkbox" name="consent" required> <span>Согласен на обработку персональных данных для оформления заказа</span></label>
        <div class="form-status" role="status" aria-live="polite" data-form-status></div>
        <button class="btn btn--primary btn--lg btn--block" type="submit"><svg class="i"><use href="#i-check"/></svg>Оформить заказ</button>
        <p class="form-note">После оформления менеджер подтвердит наличие, стоимость доставки и сборки, способ оплаты. Оплата на сайте не производится.</p>
      </form>
    </aside>
  </div>
</div>
